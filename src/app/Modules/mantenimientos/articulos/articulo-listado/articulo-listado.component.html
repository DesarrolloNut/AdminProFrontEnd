<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-md-6 align-middle">
                        <h4 class="card-title">Listado de artículos</h4>
                    </div>
                    <div class="col-md-6 text-right">
                        <button [routerLink]="[0]" class="btn btn-info"> <i class="fa fa-plus"></i> Nuevo
                            artículo
                        </button>
                    </div>
                    <div class="col-md-12 p-2">

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <label for="search" class="input-group-text bg-white">
                                    <span class="bg-white" style="border-right:none">
                                        <i class="ti-search"></i>
                                    </span>
                                </label>
                            </div>
                            <input [(ngModel)]="Search" (keyup)="getData()" type="text"
                                style="border-left:none !important;" class="form-control" placeholder="Buscar">
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover mb-0 no-wrap v-middle">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Nombre</th>
                                <!-- <th>Chasis</th> -->
                                <th>Código de referencia</th>
                                <th></th>

                            </tr>
                        </thead>
                        <tbody [hidden]="Cargando">

                            <tr *ngFor="let item of data">
                                <td><span class="badge badge-light text-info ">{{item.id}}</span></td>
                                <td>
                                    <span> {{ item.nombre | titlecase }}</span>
                                </td>
                                <!-- <td>
                                    <span>{{ item.chasis | uppercase }}</span>
                                </td> -->
                                <td>
                                    <span>
                                        {{item.codigoReferencia }}
                                    </span>
                                </td>
                                <td>

                                    <!-- <button class="btn btn-sm btn-light m-1"
                                        (click)="abrirModalClientesPropietarios(item.id,modalPropietariosChasis)">
                                        <i class="fa fa-sm fa-user"></i>
                                    </button> -->

                               

                                    <button class="btn btn-sm btn-info" [routerLink]="[item.id]">
                                        <i class="fa fa-sm fa-edit"></i>
                                    </button>
                                </td>
                            </tr>

                        </tbody>
                    </table>

                </div>



                <app-loading-listado [hidden]="!Cargando"></app-loading-listado>

                <div class="row ">
                    <div class="col-md-8 col-xs-12 ">
                        <ngb-pagination [collectionSize]="paginaTotalRecords" [(page)]="paginaNumeroActual"
                            [pageSize]="paginaSize" [maxSize]="5" [boundaryLinks]="true" (pageChange)="getData()">
                        </ngb-pagination>
                    </div>

                    <div class="col-md-4 text-right d-none d-md-block  ">
                        <select class="form-control d-block" name="paginaSize" [(ngModel)]="paginaSize"
                            (change)="getData()">
                            <option [ngValue]="5">5 registro por pagina</option>
                            <option [ngValue]="10">10 registro por pagina</option>
                            <option [ngValue]="15">15 registro por pagina</option>
                        </select>
                    </div>
                </div>


            </div>
        </div>
    </div>
</div>




<ng-template #modalPropietariosChasis let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Propietarios de este chasis</h4>
        <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="row">
            <div class="form-group col-12">
                <label for="example-email">Clientes</label>
                <ng-select [items]="clientes" bindLabel="nombre" bindValue="codigo" [loading]="loadingClientes"
                    [(ngModel)]="clienteSeleccionado" (search)="getClientes($event)" notFoundText="No resultados">
                </ng-select>
            </div>
            <div class="col-12">
                <button (click)="registrarVehiculoClienteEnrroll()" *ngIf="!loadingBtnGuardandoVehiculoClienteEnrroll"
                    [disabled]="clienteSeleccionado <= 0" class="btn btn-sm btn-info btn-block">
                    Asignar vehículo al cliente seleccionado <i class="fa fa-check"></i>
                </button>

                <!-- boton cargando -->
                <button *ngIf="loadingBtnGuardandoVehiculoClienteEnrroll" disabled class="btn btn-info m-1 btn-block"
                    type="button">
                    <span class="spinner-border spinner-border-sm"></span> Registrando...
                </button>


            </div>
            <div class="col-12">
                <hr>
            </div>
            <div class="col-12" *ngIf="!loadingClientesPropietarios">

                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Propietario</th>
                            <th scope="col">Fecha</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of vehiculoClientePropietarios">
                            <td>{{item.cliente}}</td>
                            <td>{{item.fecha | date}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <app-loading-listado [hidden]="!loadingClientesPropietarios"></app-loading-listado>
    </div>
    <div class="modal-footer">
    </div>
</ng-template>
